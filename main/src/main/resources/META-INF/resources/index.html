<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG · Hybrid retrieval system</title>

    <!--
      The whole client, in one file: no jQuery, no Bootstrap, no PatternFly and NOT A SINGLE
      request to a CDN. Those three libraries added up to ~300 KB pulled from cloudflare to, in
      practice, call querySelector and add a few classes — and they left the interface useless
      behind a firewall, which contradicted deploySinConexion.sh.

      What this version does and the previous one did not: show where every answer comes from.
      Under each assistant message you get the sources and, folded away, the retrieval trace with
      the BRANCH that found each fragment (dense, lexical or both) and its RRF score. That
      information already existed in the server log; here it is shown to whoever is reading the
      answer, who is the one who needs to tell a citation from a hallucination.
    -->

    <style>
        /* ---------------------------------------------------------------- variables */
        :root {
            --bg:        #f4f6f8;
            --surface:   #ffffff;
            --surface-2: #f0f2f5;
            --ink:       #14181d;
            --ink-soft:  #4a545f;
            --muted:     #78838f;
            --line:      #dde2e8;
            --accent:    #1f5fa8;
            --accent-ink:#ffffff;
            --user-bg:   #1f5fa8;
            --user-ink:  #ffffff;
            --ok:        #2e7d5b;
            --warn:      #9a6b12;
            --danger:    #b3352c;
            --dense:     #1f5fa8;   /* D   */
            --lexical:   #8a5a12;   /* L   */
            --both:      #2e7d5b;   /* D+L */
            --radius:    10px;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg:#121519; --surface:#1a1f25; --surface-2:#20262d; --ink:#e6eaee;
                --ink-soft:#b6c0ca; --muted:#8b96a2; --line:#2c343d; --accent:#5b9bd8;
                --accent-ink:#0d1116; --user-bg:#2b5f96; --user-ink:#f2f6fa;
                --ok:#5cc191; --warn:#d9a441; --danger:#e0736a;
                --dense:#5b9bd8; --lexical:#d9a441; --both:#5cc191;
            }
        }

        /* ---------------------------------------------------------------- layout */
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.55;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        /* ---------------------------------------------------------------- header */
        .topbar {
            display: flex; align-items: center; gap: 16px;
            padding: 10px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }
        .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
        .brand .logo {
            font-family: var(--mono); font-weight: 700; font-size: 15px; letter-spacing: .08em;
            padding: 3px 8px; border-radius: 6px;
            background: var(--accent); color: var(--accent-ink);
        }
        .brand .sub { color: var(--muted); font-size: 13px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 720px) { .brand .sub { display: none; } }

        .topbar-right { display: flex; align-items: center; gap: 14px; }

        .status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
        .status i {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--danger); flex: none;
            transition: background .2s ease;
        }
        .status.on i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }

        .field { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
        select, input[type=text], textarea {
            font: inherit; color: var(--ink); background: var(--surface);
            border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
        }
        select:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 1px;
        }
        select { font-size: 13px; max-width: 240px; }

        /* admin menu: a native <details>, so not one line of JS is needed to open it */
        .menu { position: relative; }
        .menu > summary {
            display: inline-block; list-style: none; cursor: pointer; user-select: none;
            padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line);
            color: var(--ink-soft); font-size: 15px; line-height: 1.2;
        }
        .menu > summary::-webkit-details-marker { display: none; }
        .menu > summary:hover { background: var(--surface-2); }
        .menu-panel {
            position: absolute; right: 0; top: calc(100% + 8px); z-index: 20;
            width: 280px; padding: 14px;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.14);
        }
        .menu-title { margin: 0 0 10px; font-size: 12px; letter-spacing: .06em;
            text-transform: uppercase; color: var(--muted); }
        .menu-panel hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
        .menu-panel input[type=file] { width: 100%; font-size: 12px; margin-bottom: 8px; }

        /* ---------------------------------------------------------------- buttons */
        .btn {
            font: inherit; font-size: 14px; cursor: pointer;
            padding: 7px 14px; border-radius: 8px;
            border: 1px solid var(--line); background: var(--surface); color: var(--ink);
            transition: background .15s ease, opacity .15s ease;
        }
        .btn:hover:not(:disabled) { background: var(--surface-2); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
        .btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
        .btn-block { display: block; width: 100%; margin-top: 8px; text-align: left; }

        /* ---------------------------------------------------------------- entry gate */
        main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .gate {
            margin: auto; padding: 40px 24px; max-width: 460px; width: 100%; text-align: center;
        }
        .gate h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
        .gate p { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
        .gate-row { display: flex; gap: 10px; }
        .gate-row input { flex: 1; }
        .hint { font-size: 13px; color: var(--muted); margin-top: 14px; min-height: 20px; }
        /* On reconnect the gate shrinks to a bar, so the previous conversation stays visible. */
        .gate.compact { margin: 0 auto; padding: 12px 20px 4px; max-width: 780px; }
        .gate.compact h1, .gate.compact > p:not(.hint) { display: none; }
        .gate.compact .hint { margin-top: 8px; }

        /* ---------------------------------------------------------------- chat */
        .chat {
            flex: 1; min-height: 0; overflow-y: auto;
            padding: 24px 20px 8px;
            display: flex; flex-direction: column; gap: 18px;
            scroll-behavior: smooth;
        }
        .turn { display: flex; flex-direction: column; max-width: 780px; width: 100%; margin: 0 auto; }
        .turn.user { align-items: flex-end; }

        .bubble {
            padding: 11px 15px; border-radius: 14px; max-width: 88%;
            background: var(--surface); border: 1px solid var(--line);
            overflow-wrap: anywhere;
        }
        .turn.user .bubble {
            background: var(--user-bg); color: var(--user-ink);
            border-color: transparent; border-bottom-right-radius: 5px;
        }
        .turn.assistant .bubble { border-bottom-left-radius: 5px; }

        .who { font-size: 12px; color: var(--muted); margin: 0 4px 5px; font-family: var(--mono); }
        .meta { font-size: 12px; color: var(--muted); margin: 6px 4px 0; font-family: var(--mono); }

        /* markdown inside the bubble */
        .bubble > :first-child { margin-top: 0; }
        .bubble > :last-child { margin-bottom: 0; }
        .bubble p { margin: 0 0 .7em; }
        .bubble h3, .bubble h4, .bubble h5, .bubble h6 { margin: .9em 0 .4em; font-size: 1em; font-weight: 650; }
        .bubble ul, .bubble ol { margin: 0 0 .7em; padding-left: 1.35em; }
        .bubble li { margin: .18em 0; }
        .bubble code { font-family: var(--mono); font-size: .88em;
            background: var(--surface-2); padding: .12em .38em; border-radius: 4px; }
        .turn.user .bubble code { background: rgba(255,255,255,.18); }
        .bubble pre {
            background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
            padding: 10px 12px; overflow-x: auto; margin: 0 0 .7em;
        }
        .bubble pre code { background: none; padding: 0; font-size: .86em; }
        .bubble a { color: var(--accent); }
        .bubble blockquote { margin: 0 0 .7em; padding-left: .8em;
            border-left: 3px solid var(--line); color: var(--ink-soft); }

        /* system messages */
        .sysmsg {
            max-width: 780px; width: 100%; margin: 0 auto;
            font-size: 13px; color: var(--muted); font-style: italic; text-align: center;
        }
        .sysmsg.err { color: var(--danger); font-style: normal; }

        /* ---------------------------------------------------------------- sources */
        .sources { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 4px 0; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; font-family: var(--mono);
            padding: 3px 9px 3px 3px; border-radius: 999px;
            background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft);
        }
        .chip .kind {
            font-size: 10px; font-weight: 700; letter-spacing: .04em;
            padding: 2px 6px; border-radius: 999px;
            background: var(--surface-2); color: var(--muted);
        }
        .chip .kind.pdf { color: var(--danger); }
        .chip .kind.csv { color: var(--ok); }
        .chip .kind.txt { color: var(--accent); }
        .chip .loc { color: var(--muted); }

        .no-context {
            margin: 9px 4px 0; font-size: 12.5px; color: var(--warn);
            display: flex; align-items: center; gap: 7px;
        }
        .no-context::before {
            content: "!"; flex: none;
            width: 15px; height: 15px; border-radius: 50%;
            border: 1.5px solid currentColor; font-size: 10px; font-weight: 700;
            display: grid; place-items: center;
        }

        /* ---------------------------------------------------------------- trace */
        .trace { margin: 9px 4px 0; font-size: 13px; }
        .trace > summary {
            cursor: pointer; user-select: none; color: var(--muted);
            font-family: var(--mono); font-size: 12px; padding: 2px 0;
        }
        .trace > summary:hover { color: var(--ink-soft); }
        .trace-body {
            margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius);
            background: var(--surface); overflow: hidden;
        }
        .frags-wrap { overflow-x: auto; }
        table.frags { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .frags th {
            text-align: left; font-weight: 600; font-size: 10.5px;
            letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
            color: var(--muted); padding: 8px 11px;
            background: var(--surface-2); border-bottom: 1px solid var(--line);
        }
        .frags td {
            padding: 9px 11px; vertical-align: top; border-top: 1px solid var(--line);
            font-family: var(--mono); line-height: 1.5;
        }
        .frags tbody tr:first-child > td { border-top: 0; }
        .frags tbody tr.row { cursor: pointer; }
        .frags tbody tr.row:hover > td { background: var(--surface-2); }
        .origin {
            font-weight: 700; font-size: 11px; letter-spacing: .04em;
            padding: 2px 7px; border-radius: 5px; cursor: help;
            border: 1px solid currentColor;
        }
        .origin.d   { color: var(--dense);   }
        .origin.l   { color: var(--lexical); }
        .origin.dl  { color: var(--both);    }
        .c-origin { white-space: nowrap; }
        .c-src    { color: var(--ink-soft); overflow-wrap: break-word; min-width: 200px; }
        .c-src .loc { display: block; color: var(--muted); }
        .c-score  { color: var(--muted); text-align: right; white-space: nowrap; }
        .c-frag   { color: var(--ink-soft); overflow-wrap: anywhere; min-width: 210px; }
        .c-frag::after { content: "  ⌄"; color: var(--muted); }
        tr.row.open .c-frag::after { content: "  ⌃"; }
        .frags tr.full > td { background: var(--surface-2); padding-top: 0; }
        .full-text {
            max-height: 220px; overflow-y: auto; padding: 9px 11px;
            background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
            font-size: 12px; color: var(--ink-soft);
            white-space: pre-wrap; overflow-wrap: anywhere;
        }
        .legend { padding: 9px 12px; border-top: 1px solid var(--line);
            background: var(--surface-2); color: var(--muted); font-size: 11.5px; }

        /* ---------------------------------------------------------------- typing */
        .dots { display: inline-flex; gap: 4px; padding: 3px 0; }
        .dots i {
            width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
            animation: blink 1.3s infinite ease-in-out;
        }
        .dots i:nth-child(2) { animation-delay: .18s; }
        .dots i:nth-child(3) { animation-delay: .36s; }
        @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .55; } }

        /* ---------------------------------------------------------------- composer */
        .composer {
            display: flex; gap: 10px; align-items: flex-end;
            padding: 12px 20px 16px;
            border-top: 1px solid var(--line); background: var(--surface);
        }
        .composer-inner { display: flex; gap: 10px; align-items: flex-end;
            max-width: 780px; width: 100%; margin: 0 auto; }
        .composer textarea {
            flex: 1; resize: none; max-height: 160px; line-height: 1.5; padding: 9px 12px;
        }
        [hidden] { display: none !important; }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <span class="logo">RAG</span>
        <span class="sub">Hybrid retrieval over a local corpus</span>
    </div>

    <div class="topbar-right">
        <span id="status" class="status"><i></i><span id="status-text">Disconnected</span></span>

        <label class="field">
            Model
            <!-- Filled from /service/models with the models REALLY configured: change
                 GPTOSS_CHAT_MODEL and the dropdown follows without touching this HTML. -->
            <select id="model"><option value="" disabled selected>loading…</option></select>
        </label>

        <details class="menu" id="admin-menu">
            <summary title="Administration">&#8942;</summary>
            <div class="menu-panel">
                <p class="menu-title">Administration</p>
                <input type="file" id="file" accept=".pdf,.txt,.csv">
                <button id="upload" class="btn btn-block" disabled>Upload and index</button>
                <hr>
                <button id="clean" class="btn btn-block">Clean uploads</button>
                <button id="reset" class="btn btn-block btn-danger">Rebuild the index</button>
            </div>
        </details>
    </div>
</header>

<main>
    <section class="gate" id="gate">
        <h1>Connect to start</h1>
        <p>Pick a model, type a name, and ask about the contents of the corpus.</p>
        <div class="gate-row">
            <input type="text" id="name" placeholder="Your name" autocomplete="off">
            <button id="connect" class="btn btn-primary" disabled>Connect</button>
        </div>
        <p class="hint" id="hint"></p>
    </section>

    <div class="chat" id="chat" hidden></div>
</main>

<footer class="composer" id="composer" hidden>
    <div class="composer-inner">
        <textarea id="msg" rows="1"
                  placeholder="Type your question…    Enter sends · Shift+Enter adds a line"></textarea>
        <button id="send" class="btn btn-primary" disabled>Send</button>
    </div>
</footer>

<script>
    "use strict";

    const $ = id => document.getElementById(id);

    let socket = null;
    let connected = false;
    let username = "";
    let adminKey = null;

    /* ================================================================= helpers */

    /** Everything coming from the model or the corpus goes through here before it touches the DOM. */
    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[c]);
    }

    /** 1943 -> "1.9 s"  ·  340 -> "340 ms". */
    function formatMillis(ms) {
        if (!ms) return "";
        return ms < 1000 ? ms + " ms" : (ms / 1000).toFixed(1) + " s";
    }

    /* ================================================================= markdown

       A renderer of our own instead of marked + DOMPurify. Two reasons:

       1) No CDN and no third-party files in the repository, so the interface still works behind
          a firewall — which is the whole premise of deploySinConexion.sh.
       2) Safety does not depend on running a sanitiser in the right order: here the text is
          ESCAPED FIRST and only afterwards are the tags this function generates inserted. A model
          that returns <script> produces &lt;script&gt;, and there is no path for HTML from the
          model to reach the DOM.

       In exchange it covers a subset of Markdown, which is exactly what a question-and-answer
       assistant produces: headings, lists, bold, italics, code, quotes and links.
    ============================================================================== */

    function renderMarkdown(source) {
        const fences = [];
        const ticks = [];
        let text = escapeHtml(source);

        // Code blocks are set aside BEFORE anything else: inside them, asterisks and hashes are
        // literal, not marks. The placeholder is <F0>, and the "<" is deliberate: the text is
        // already escaped, so a literal "<" is IMPOSSIBLE in it and no model can forge a
        // placeholder that sneaks through the final replacement.
        text = text.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => "<F" + (fences.push(code) - 1) + ">");
        text = text.replace(/`([^`\n]+)`/g, (_, code) => "<T" + (ticks.push(code) - 1) + ">");

        const out = [];
        let list = null;                                    // "ul" | "ol" | null
        const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };

        for (const raw of text.split("\n")) {
            const line = raw.trimEnd();

            if (!line.trim()) { closeList(); continue; }

            // A code block takes a whole line of its own: outside the <p>, or the HTML is invalid.
            if (/^<F\d+>$/.test(line.trim())) { closeList(); out.push(line.trim()); continue; }

            const heading = line.match(/^(#{1,4})\s+(.*)$/);
            if (heading) {
                closeList();
                const level = Math.min(heading[1].length + 2, 6);   // # -> h3, so it never competes with the h1
                out.push("<h" + level + ">" + inlineMarks(heading[2]) + "</h" + level + ">");
                continue;
            }

            const quote = line.match(/^&gt;\s?(.*)$/);
            if (quote) { closeList(); out.push("<blockquote>" + inlineMarks(quote[1]) + "</blockquote>"); continue; }

            const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
            if (bullet) {
                if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
                out.push("<li>" + inlineMarks(bullet[1]) + "</li>");
                continue;
            }

            const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
            if (numbered) {
                if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
                out.push("<li>" + inlineMarks(numbered[1]) + "</li>");
                continue;
            }

            closeList();
            out.push("<p>" + inlineMarks(line) + "</p>");
        }
        closeList();

        return out.join("")
            .replace(/<T(\d+)>/g, (_, i) => "<code>" + ticks[i] + "</code>")
            .replace(/<F(\d+)>/g, (_, i) => "<pre><code>" + fences[i] + "</code></pre>");
    }

    /** Marks inside one line. The text is ALREADY escaped by the time it gets here. */
    function inlineMarks(text) {
        return text
            // The link scheme is pinned in the pattern itself: javascript: does not match.
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    }

    /**
     * Splits the reasoning from the answer.
     *
     * gpt-oss:20b is a reasoning model and, depending on how Ollama serves it, it can return its
     * chain of thought glued in front of the answer. Showing it raw is confusing; hiding it
     * altogether would throw away something interesting for a project about models. So it is
     * split off and offered folded.
     */
    function splitThinking(raw) {
        const tagged = String(raw ?? "").match(/^\s*<think(?:ing)?>([\s\S]*?)<\/think(?:ing)?>\s*([\s\S]*)$/i);
        if (tagged) return { thinking: tagged[1].trim(), answer: tagged[2].trim() };

        // Harmony-format channels, in case they arrive without tags.
        const harmony = String(raw ?? "").match(/^\s*analysis\s*([\s\S]*?)assistantfinal\s*([\s\S]*)$/i);
        if (harmony) return { thinking: harmony[1].trim(), answer: harmony[2].trim() };

        return { thinking: null, answer: String(raw ?? "") };
    }

    /* ================================================================= sources */

    /**
     * "warehouse_inventory.csv (row 12)" -> { name, locator, kind }
     *
     * The locator is whatever is inside the last parentheses, whatever it says. That is on
     * purpose: it comes from Sources.format on the server, and this way "(row 12)", "(page 4)"
     * or anything added later keeps working without touching this file.
     */
    function parseSource(source) {
        const value = String(source ?? "");
        const locator = (value.match(/\(([^)]*)\)\s*$/) || ["", ""])[1];
        const name = value.replace(/\s*\([^)]*\)\s*$/, "").trim();
        const ext = (name.split(".").pop() || "").toLowerCase();
        return { name, locator, kind: ["pdf", "csv", "txt"].includes(ext) ? ext : "doc" };
    }

    const ORIGIN_LABEL = {
        "D":   ["d",  "Dense search only: found by MEANING"],
        "L":   ["l",  "Lexical search only: found by the LITERAL WORD (BM25)"],
        "D+L": ["dl", "Both branches, down independent paths: meaning AND literal match"]
    };

    /**
     * Several pages of the same document collapse into "page 2, 3": the question this row answers
     * is WHICH DOCUMENT the answer came from, and repeating the name three times answers it worse.
     */
    function joinLocators(locators) {
        if (!locators.length) return "";
        const label = locators[0].replace(/\s*\d+\s*$/, "").trim();
        const sameLabel = label && locators.every(l => l.replace(/\s*\d+\s*$/, "").trim() === label);
        return sameLabel
            ? label + " " + locators.map(l => (l.match(/\d+/) || [l])[0]).join(", ")
            : locators.join(" · ");
    }

    function buildSources(sources) {
        const byDocument = new Map();
        for (const item of sources) {
            const parsed = parseSource(item.source);
            if (!byDocument.has(parsed.name)) {
                byDocument.set(parsed.name, { kind: parsed.kind, locators: [] });
            }
            const entry = byDocument.get(parsed.name);
            if (parsed.locator && !entry.locators.includes(parsed.locator)) {
                entry.locators.push(parsed.locator);
            }
        }

        const wrap = document.createElement("div");
        wrap.className = "sources";

        for (const [name, entry] of byDocument) {
            const chip = document.createElement("span");
            chip.className = "chip";

            const kind = document.createElement("span");
            kind.className = "kind " + entry.kind;
            kind.textContent = entry.kind.toUpperCase();

            const label = document.createElement("span");
            label.textContent = name;

            chip.append(kind, label);

            const locators = joinLocators(entry.locators);
            if (locators) {
                const loc = document.createElement("span");
                loc.className = "loc";
                loc.textContent = locators;
                chip.append(loc);
            }
            wrap.append(chip);
        }
        return wrap;
    }

    /** The fragment cut down to one table row. The full one unfolds when the row is clicked. */
    function fragmentPreview(text) {
        const flat = String(text ?? "").replace(/\s+/g, " ").trim();
        return flat.length <= 150 ? flat : flat.slice(0, 150) + "…";
    }

    /** The "Source" cell: the file on one line and the locator underneath, so a long name does
     *  not get broken in half ("manual_misiones_espacia / les.pdf"). */
    function sourceCell(source) {
        const parsed = parseSource(source);
        const wrap = document.createElement("span");
        wrap.append(document.createTextNode(parsed.name));
        if (parsed.locator) {
            const loc = document.createElement("span");
            loc.className = "loc";
            loc.textContent = parsed.locator;
            wrap.append(loc);
        }
        return wrap;
    }

    /** One cell: with text, or with an element that is already built. */
    function cell(className, content) {
        const td = document.createElement("td");
        td.className = className;
        if (content instanceof Node) td.append(content); else td.textContent = content;
        return td;
    }

    /**
     * The trace: which fragments the model saw, which branch brought each one in, and with what
     * score. Folded by default — whoever wants the answer has it above; whoever wants to know WHY
     * that answer, opens it.
     */
    function buildTrace(sources) {
        const both = sources.filter(s => s.origin === "D+L").length;
        const onlyLexical = sources.filter(s => s.origin === "L").length;

        const details = document.createElement("details");
        details.className = "trace";

        const summary = document.createElement("summary");
        const parts = [sources.length + (sources.length === 1 ? " fragment" : " fragments")];
        if (both) parts.push(both + " in both branches");
        if (onlyLexical) parts.push(onlyLexical + " lexical only");
        summary.textContent = "Retrieval trace · " + parts.join(" · ");
        details.append(summary);

        const body = document.createElement("div");
        body.className = "trace-body";

        const table = document.createElement("table");
        table.className = "frags";

        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (const label of ["Branch", "Source", "RRF", "Fragment"]) {
            const th = document.createElement("th");
            th.textContent = label;
            headRow.append(th);
        }
        thead.append(headRow);

        const tbody = document.createElement("tbody");

        for (const item of sources) {
            const [cssClass, originTitle] = ORIGIN_LABEL[item.origin] || ["d", "Unknown branch"];
            const badge = document.createElement("span");
            badge.className = "origin " + cssClass;
            badge.textContent = item.origin;
            badge.title = originTitle;

            const row = document.createElement("tr");
            row.className = "row";
            row.title = "Click to see the full fragment";
            row.append(
                cell("c-origin", badge),
                cell("c-src", sourceCell(item.source)),
                cell("c-score", Number(item.score).toFixed(4)),
                cell("c-frag", fragmentPreview(item.text))
            );

            // The COMPLETE fragment, in a row of its own that unfolds. In the table it is cut
            // short so the four columns fit, but what has to be showable — and what turns this
            // into evidence rather than a label — is the text the model actually read, uncut.
            const full = document.createElement("tr");
            full.className = "full";
            full.hidden = true;
            const fullCell = document.createElement("td");
            fullCell.colSpan = 4;
            const fullText = document.createElement("div");
            fullText.className = "full-text";
            fullText.textContent = item.text;
            fullCell.append(fullText);
            full.append(fullCell);

            row.addEventListener("click", () => {
                full.hidden = !full.hidden;
                row.classList.toggle("open", !full.hidden);
            });

            tbody.append(row, full);
        }

        table.append(thead, tbody);

        const wrap = document.createElement("div");
        wrap.className = "frags-wrap";
        wrap.append(table);
        body.append(wrap);

        const legend = document.createElement("div");
        legend.className = "legend";
        legend.textContent = "D = dense search (bge-m3, meaning) · L = lexical search "
            + "(BM25, literal match) · D+L = both · RRF = fusion score, 1/(60 + rank) per branch";
        body.append(legend);

        details.append(body);
        return details;
    }

    /* ================================================================= messages */

    function turn(kind) {
        const el = document.createElement("div");
        el.className = "turn " + kind;
        return el;
    }

    function appendUserTurn(text) {
        const t = turn("user");
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;                          // no markdown: this is what they typed
        t.append(bubble);
        $("chat").append(t);
        scrollToBottom();
    }

    function appendAssistantTurn(message) {
        const t = turn("assistant");

        const who = document.createElement("div");
        who.className = "who";
        who.textContent = message.model || message.from || "assistant";
        t.append(who);

        const split = splitThinking(message.message);

        if (split.thinking) {
            const think = document.createElement("details");
            think.className = "trace";
            const summary = document.createElement("summary");
            summary.textContent = "Model reasoning";
            const body = document.createElement("div");
            body.className = "trace-body";
            const inner = document.createElement("div");
            inner.className = "full-text";
            inner.style.maxHeight = "260px";
            inner.textContent = split.thinking;
            body.append(inner);
            think.append(summary, body);
            t.append(think);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = renderMarkdown(split.answer);    // safe: escaped before it is marked up
        t.append(bubble);

        const sources = Array.isArray(message.sources) ? message.sources : [];
        if (sources.length) {
            t.append(buildSources(sources));
            t.append(buildTrace(sources));
        } else {
            const none = document.createElement("div");
            none.className = "no-context";
            none.textContent = "Answered with nothing retrieved";
            none.title = "The search returned no fragment above the threshold: what you are "
                + "reading comes from the model, not from the corpus.";
            t.append(none);
        }

        if (message.millis) {
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = formatMillis(message.millis) + " to generate";
            t.append(meta);
        }

        $("chat").append(t);
        scrollToBottom();
    }

    function appendSystem(text, isError) {
        const el = document.createElement("div");
        el.className = "sysmsg" + (isError ? " err" : "");
        el.textContent = text;
        $("chat").append(el);
        scrollToBottom();
    }

    function showTyping() {
        hideTyping();
        const t = turn("assistant");
        t.id = "typing";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
        t.append(bubble);
        $("chat").append(t);
        scrollToBottom();
    }

    function hideTyping() {
        const el = $("typing");
        if (el) el.remove();
    }

    function scrollToBottom() {
        const chat = $("chat");
        chat.scrollTop = chat.scrollHeight;
    }

    /* ================================================================= connection */

    function setStatus(isConnected) {
        connected = isConnected;
        $("status").classList.toggle("on", isConnected);
        $("status-text").textContent = isConnected ? "Connected" : "Disconnected";
        $("send").disabled = !isConnected;
        $("model").disabled = isConnected;
    }

    function refreshGate() {
        const ready = $("name").value.trim() !== "" && $("model").value !== "";
        $("connect").disabled = !ready;
        $("hint").textContent = $("model").value === ""
            ? "Pick a model to be able to connect."
            : (ready ? "" : "Type a name.");
    }

    function connect() {
        if (connected) return;
        username = $("name").value.trim();
        if (!username || !$("model").value) { refreshGate(); return; }

        // wss:// when the page is served over HTTPS, or the browser would block the socket as
        // mixed content.
        const proto = location.protocol === "https:" ? "wss://" : "ws://";
        socket = new WebSocket(proto + location.host + "/chat/" + encodeURIComponent(username));

        socket.onopen = () => {
            setStatus(true);
            $("gate").hidden = true;
            $("chat").hidden = false;
            $("composer").hidden = false;
            $("msg").focus();
        };

        socket.onmessage = event => {
            const message = JSON.parse(event.data);
            if (message.type === "USER_JOINED") {
                appendSystem("Connected as " + message.from);
                return;
            }
            if (message.type !== "CHAT_MESSAGE") return;

            if (message.fromAssistant) {
                hideTyping();
                appendAssistantTurn(message);
                $("send").disabled = false;
                $("msg").focus();
            } else {
                appendUserTurn(message.message);
                showTyping();
            }
        };

        socket.onerror = () => { hideTyping(); appendSystem("Connection error with the server.", true); };

        // This also fires when the server restarts: without it, the interface stays "connected"
        // and messages are lost in silence.
        socket.onclose = () => {
            setStatus(false);
            hideTyping();
            appendSystem("Connection closed. Connect again to carry on.", true);
            $("gate").hidden = false;
            $("gate").classList.add("compact");
            $("composer").hidden = true;
            refreshGate();
        };
    }

    function send() {
        if (!connected || !socket || socket.readyState !== WebSocket.OPEN) {
            appendSystem("You are not connected.", true);
            return;
        }
        const text = $("msg").value.trim();
        if (!text) return;                                  // the server drops empty ones anyway

        socket.send(JSON.stringify({
            type: "CHAT_MESSAGE", from: username, message: text, llm: $("model").value
        }));

        $("msg").value = "";
        $("msg").style.height = "auto";
        $("send").disabled = true;
    }

    /* ================================================================= models */

    async function loadModels() {
        const select = $("model");
        try {
            const response = await fetch("/service/models");
            if (!response.ok) throw new Error(response.status);
            const models = await response.json();

            select.innerHTML = "";
            for (const [slot, model] of Object.entries(models)) {
                const option = document.createElement("option");
                option.value = slot;
                option.textContent = slot + " → " + model;
                select.append(option);
            }
            select.selectedIndex = 0;                       // the first one of the ModelSlot enum
        } catch (e) {
            // With no backend there are no real slots; offer the bare minimum so the interface is
            // not left useless, and warn that the labels may not match what is configured.
            select.innerHTML = "";
            for (const slot of ["gpto", "llama", "deepseek", "mistral"]) {
                const option = document.createElement("option");
                option.value = slot;
                option.textContent = slot;
                select.append(option);
            }
            $("hint").textContent = "Could not read the list of models from the server.";
        }
        refreshGate();
    }

    /* ================================================================= administration */

    function adminHeaders() {
        // The key is asked for the FIRST time an admin button is used (lazily), not on every
        // page load.
        if (adminKey === null) {
            adminKey = prompt("Enter the admin key for this session:") || "";
        }
        return { "X-API-KEY": adminKey };
    }

    async function adminPost(path, button, runningText) {
        button.disabled = true;
        $("admin-menu").open = false;
        if (runningText) appendSystem(runningText);
        try {
            const response = await fetch(path, { method: "POST", headers: adminHeaders() });
            const body = await response.text();
            if (response.ok) {
                appendSystem(body);
            } else if (response.status === 401 || response.status === 403) {
                adminKey = null;                            // ask for it again next time
                appendSystem("Wrong admin key.", true);
            } else if (response.status === 409) {
                appendSystem("A reindex is already running. Wait for it to finish.", true);
            } else {
                appendSystem(body || ("Error " + response.status), true);
            }
        } catch (e) {
            appendSystem("Could not reach the server.", true);
        } finally {
            button.disabled = false;
        }
    }

    async function uploadFile() {
        const file = $("file").files[0];
        if (!file) return;

        const form = new FormData();
        form.append("file", file);
        form.append("fileName", file.name);

        $("upload").disabled = true;
        $("admin-menu").open = false;
        appendSystem("Uploading and indexing " + file.name + "…");

        try {
            const response = await fetch("/service/admin/upload",
                { method: "POST", headers: adminHeaders(), body: form });
            const body = await response.text();

            if (response.ok) {
                appendSystem(body);
                $("file").value = "";
            } else if (response.status === 413) {
                // The limit is set by quarkus.http.limits.max-body-size. Without this branch the
                // browser shows a generic error and it looks like the server broke.
                appendSystem("The file is over the server's upload limit (15 MB).", true);
            } else if (response.status === 401 || response.status === 403) {
                adminKey = null;
                appendSystem("Wrong admin key.", true);
            } else {
                appendSystem(body || ("Error " + response.status), true);
            }
        } catch (e) {
            appendSystem("Could not upload the file.", true);
        } finally {
            $("upload").disabled = !$("file").files.length;
        }
    }

    /* ================================================================= start-up */

    document.addEventListener("DOMContentLoaded", () => {
        loadModels();

        $("connect").addEventListener("click", connect);
        $("send").addEventListener("click", send);
        $("name").addEventListener("input", refreshGate);
        $("model").addEventListener("change", refreshGate);
        $("name").addEventListener("keydown", e => { if (e.key === "Enter") connect(); });

        // Enter sends, Shift+Enter adds a line, and the box grows with the text.
        $("msg").addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
        });
        $("msg").addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 160) + "px";
        });

        $("file").addEventListener("change", () => { $("upload").disabled = !$("file").files.length; });
        $("upload").addEventListener("click", uploadFile);

        $("reset").addEventListener("click", () => {
            if (!confirm("The index will be rebuilt from the versioned corpus. It takes a few seconds. Continue?")) return;
            adminPost("/service/admin/reset", $("reset"), "Rebuilding the index…");
        });

        $("clean").addEventListener("click", () => {
            if (!confirm("Every uploaded file will be deleted and the index rebuilt from the base corpus. Continue?")) return;
            adminPost("/service/admin/clean-uploads", $("clean"), "Cleaning uploads and rebuilding the index…");
        });

        // Close the admin menu when clicking outside it.
        document.addEventListener("click", e => {
            const menu = $("admin-menu");
            if (menu.open && !menu.contains(e.target)) menu.open = false;
        });
    });
</script>
</body>
</html>
