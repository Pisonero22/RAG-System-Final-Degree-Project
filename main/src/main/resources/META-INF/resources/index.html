<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Quarkus Chat!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/patternfly/3.24.0/css/patternfly.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/patternfly/3.24.0/css/patternfly-additions.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #f9f9f9;
            font-family: "Segoe UI", sans-serif;
        }

        .chat-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 20px;
        }

        #chat {
            resize: none;
            overflow-y: auto;
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1em;
            background-color: #f4f4f4;
            font-size: 14px;
        }

        .user {
            font-weight: bold;
            color: #007bff;
        }

        .system-user {
            font-weight: bold;
            color: deeppink;
        }

        .system-message {
            font-style: italic;
            color: gray;
        }

        input[type="text"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-left: 10px;
            border-radius: 6px;
        }

        .navbar-pf {
            background-color: #292e34;
            color: white;
        }

        .navbar-brand p {
            color: white;
            font-size: 18px;
            margin-top: 12px;
        }
        .upload-btn {
            background-color: #17a2b8;
            color: white;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.1);
            font-size: 13px;
            padding: 6px 12px;
        }

        .upload-btn:hover {
            background-color: #138496;
            transform: scale(1.05);
            color: white;
        }


    </style>
</head>

<body>
<nav class="navbar navbar-default navbar-pf">
    <div class="navbar-header">
        <a class="navbar-brand" href="/">
            <p><strong>TFG CHAT</strong></p>
        </a>
    </div>
    <div class="nav navbar-nav navbar-right" style="padding: 12px 20px;">
        <label for="llm-select" style="color: white; margin-right: 10px;">Modelo:</label>
        <select id="llm-select" class="form-control" style="display: inline-block; width: auto;">
            <option value="" disabled selected>Selecciona un modelo</option>
            <!-- Las opciones se cargan desde /service/models con los modelos REALES
                 configurados: si cambias OLLAMA_CHAT_MODEL, el desplegable lo refleja. -->
        </select>
    </div>
</nav>


<div class="container chat-container">

    <div class="row form-group">
        <div class="col-md-4">
            <input id="name" class="form-control" type="text" placeholder="Tu nombre">
        </div>
        <div class="col-md-2">
            <button id="connect" class="btn btn-success btn-block">Conectar</button>
        </div>
    </div>

    <div class="row form-group">
        <div class="col-md-12">
            <div id="chat"></div>
        </div>
    </div>

    <div class="row form-group">
        <div class="col-md-6">
            <input id="msg" class="form-control" type="text" placeholder="Escribe tu mensaje">
        </div>
        <div class="col-md-2">
            <button id="send" class="btn btn-primary btn-block" disabled>Enviar</button>
        </div>
        <div class="col-md-2">
            <button id="reset" class="btn btn-danger btn-block">Reset Storage</button>
        </div>
        <div class="col-md-2">
            <button id="clean-uploads" class="btn btn-default btn-block">Limpiar subidas</button>
        </div>
    </div>
    <div class="row form-group" style="margin-top: 10px;">
        <div class="col-md-12 text-right">
            <input type="file" id="file-upload"
                   class="form-control input-sm"
                   accept=".pdf,.txt,.csv"
                   style="font-size: 13px; display: inline-block; width: auto; margin-right: 137px;">
            <button id="upload" class="btn btn-info upload-btn btn-sm" disabled>
                <i class="fas fa-upload"></i> Subir Archivo
            </button>
        </div>
    </div>





</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.7/js/bootstrap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/patternfly/3.24.0/js/patternfly.min.js"></script>

<script>

    let connected = false;
    let socket;
    let username = "";

    $(document).ready(function () {
        $("#connect").click(connect);
        $("#send").click(send);
        $("#name").keypress(e => { if (e.which === 13) connect(); });
        $("#msg").keypress(e => { if (e.which === 13) send(); });

        cargarModelos();

        $("#reset").click(() => {
            if (!confirm("Se reconstruirá el índice desde el corpus versionado. Tarda unos segundos. ¿Continuar?")) {
                return;
            }
            const $btn = $("#reset").prop("disabled", true);

            appendSystemMessage("Reconstruyendo el índice… esto tardará unos segundos.");

            $.ajax({
                url: "/service/admin/reset",
                type: "POST",
                headers: { "X-API-KEY": getAdminKey() },
                dataType: "text",
            success: data => {
                    $btn.prop("disabled", false);
                    appendSystemMessage("Reset completado: " + data);
                },
                error: (xhr, status, error) => {
                    $btn.prop("disabled", false);
                    appendSystemMessage(xhr.status === 409
                        ? "Ya hay un reindexado en curso. Espera a que termine."
                        : "Error en el reset: " + (xhr.responseText || xhr.statusText));
                }
            });
        });

        $("#clean-uploads").click(() => {
            if (!confirm("Se borrarán todos los archivos subidos y se reconstruirá el índice con el corpus base. ¿Continuar?")) {
                return;
            }
            const $btn = $("#clean-uploads").prop("disabled", true);
            appendSystemMessage("Limpiando subidas y reconstruyendo el índice…");
            $.ajax({
                url: "/service/admin/clean-uploads",
                type: "POST",
                dataType: "text",
                headers: { "X-API-KEY": getAdminKey() },
                success: data => {
                    $btn.prop("disabled", false);
                    appendSystemMessage(data);
                },
                error: xhr => {
                    $btn.prop("disabled", false);
                    appendSystemMessage(xhr.responseText || ("Error al limpiar subidas: " + xhr.statusText));
                }
            });
        });

        $("#connect").prop("disabled", true);

        $("#llm-select").on("change", function () {
            $("#connect").prop("disabled", $(this).val() === "");
        });

        $("#file-upload").on("change", function () {
            $("#upload").prop("disabled", !this.files.length);
        });

        $("#upload").click(function () {
            const file = $("#file-upload")[0].files[0];

            if (!file) {
                appendSystemMessage("Selecciona un archivo para subir.");
                return;
            }
            const formData = new FormData();
            formData.append("file", file);
            formData.append("fileName", file.name);


            $.ajax({
                url: "/service/admin/upload",
                type: "POST",
                data: formData,
                headers: { "X-API-KEY": getAdminKey() },
                contentType: false,
                processData: false,
                success: data => {
                    appendSystemMessage("Archivo subido correctamente: " + data);
                    $("#file-upload").val("");
                    $("#upload").prop("disabled", true);
                },
                error: (xhr, status, error) => {
                    appendSystemMessage("Error al subir archivo: " + error);
                }
            });
        });

    });

    // Rellena el desplegable con los modelos REALES que expone el backend
    // (GET /service/models). Si la llamada falla, opciones estáticas de
    // emergencia para no dejar la interfaz inutilizable.
    function cargarModelos() {
        const sel = $("#llm-select");
        $.getJSON("/service/models")
            .done(modelos => {
                Object.entries(modelos).forEach(([slot, modelo]) => {
                    sel.append(`<option value="${slot}">${slot} → ${escapeHtml(modelo)}</option>`);
                });
            })
            .fail(() => {
                sel.append('<option value="gpto">gpto (Ollama local)</option>');
                sel.append('<option value="llama">llama (Ollama local)</option>');
                sel.append('<option value="gpt">gpt (OpenAI)</option>');
                sel.append('<option value="deepseek">deepseek (Ollama local)</option>');
                sel.append('<option value="mistral">mistral (Ollama local)</option>');
            });
    }
    // La clave de administrador solo se pide la PRIMERA vez que se pulsa
    // un botón de administración (lazy), no en cada carga de página.
    let adminKey = null;
    function getAdminKey() {
        if (adminKey === null) {
            adminKey = prompt("Introduce la clave de administrador para esta sesión:") || "";
        }
        return adminKey;
    }

    function connect() {
        if(connected) return;

        username = $("#name").val().trim();

        if (!username) {
            appendSystemMessage("Escribe un nombre antes de conectar.");
            return;
        }

        // wss:// si la página se sirve por HTTPS (si no, el navegador
        // bloquearía el socket por contenido mixto).
        const wsProto = location.protocol === "https:" ? "wss://" : "ws://";
        socket = new WebSocket(wsProto + location.host + "/chat/" + encodeURIComponent(username));

        socket.onopen = () => {
            connected = true;
            $("#send").prop("disabled", false);
            $("#connect").prop("disabled", true);
            $("#name").prop("disabled", true);
            $("#msg").focus();
        };

        socket.onmessage = m => {
            const chatMessage = JSON.parse(m.data);
            switch (chatMessage.type) {
                case "USER_JOINED":
                    appendSystemMessage(`Conectado como ${chatMessage.from}`);
                    break;
                case "CHAT_MESSAGE":
                    const esRespuestaIA = chatMessage.fromAssistant === true;
                    if (esRespuestaIA) {
                        quitarGenerando()
                    }
                    appendUserMessage(chatMessage.from, chatMessage.message, esRespuestaIA);
                    if (esRespuestaIA) {
                        $("#send").prop("disabled", false);
                    }else {
                        mostrarGenerando();
                    }
                    break;
            }
        };


        socket.onerror = () => {
            quitarGenerando();
            appendSystemMessage("Error de conexión con el servidor.");
        };
        // Se dispara también si el servidor se reinicia: sin esto, la interfaz se
        // queda "conectada" y los mensajes se pierden en silencio.
        socket.onclose = () => {
            connected = false;
            $("#send").prop("disabled", true);
            $("#connect").prop("disabled", false);
            $("#name").prop("disabled", false);
            quitarGenerando();
            appendSystemMessage("Conexión cerrada. Pulsa Conectar para volver a entrar.");
        };

    }

    function send() {
        if (!connected || !socket || socket.readyState !== WebSocket.OPEN) {
            appendSystemMessage("No estás conectado.");
            return;
        }
        const msg = $("#msg").val().trim();
        if (!msg) return;                       // no mandes vacíos: el servidor los descarta

        socket.send(JSON.stringify({ type: "CHAT_MESSAGE", from: username, message: msg,
            llm: $("#llm-select").val() }));

        $("#msg").val("");
        // al enviar
        $("#send").prop("disabled", true);




    }



    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function appendSystemMessage(message) {
        $("#chat").append(`<div class="system-message">${escapeHtml(message)}</div><br>`);
        scrollToBottom();
    }

    function appendUserMessage(from, message, isAi) {
        const userClass = isAi ? "system-user" : "user";
        $("#chat").append(`<div><span class="${userClass}">${escapeHtml(from)}</span>: ${escapeHtml(message)}</div><br>`);
        scrollToBottom();
    }


    function scrollToBottom() {
        const chat = $('#chat');
        chat.scrollTop(chat[0].scrollHeight);
    }

    // Indicador temporal: se le pone id para poder retirarlo cuando llegue la respuesta.
    function mostrarGenerando() {
        quitarGenerando();                 // nunca dos a la vez
        $("#chat").append('<div id="generando" class="system-message">Generando respuesta…</div>');
        scrollToBottom();
    }

    function quitarGenerando() {
        $("#generando").remove();          // si no existe, no hace nada
    }

</script>

</body>
</html>
