# =============================================================================
#  1 · Admin endpoint security
# =============================================================================
# Read by AdminApiKeyFilter: the endpoints annotated with @AdminEndpoint
# (/service/admin/reset, /service/admin/upload, /service/admin/clean-uploads)
# require the X-API-KEY header to carry this value.
admin.api-key=${ADMIN_API_KEY:API}
# In prod there is NO default on purpose: if the variable is missing, the
# application does not start. A failed start-up beats a deployment running on
# the example key.
%prod.admin.api-key=${ADMIN_API_KEY}

# =============================================================================
#  2 · Logging
# =============================================================================
# DEBUG is what shows the RAG line (chunks + scores) and the guardrail.
#
# Do NOT raise this to INFO for the demo: the RAG line is logged at debug, so
# raising it hides the one thing that proves the fusion works. What survives is
# "answered in 4213 ms", which proves nothing. If you want a quieter log, move
# that single line in RagRetriever up to info instead of turning the category
# down.
quarkus.log.category."es.upsa".level=DEBUG
# The tests do not want the detail, only the benchmark report.
%test.quarkus.log.category."es.upsa".level=WARN

# =============================================================================
#  3 · Corpus location and upload limit
# =============================================================================
rag.location.txt=data/rag/txt
rag.location.csv=data/rag/csv
rag.location.pdf=data/rag/pdf

%prod.rag.location.txt=${RAG_TXT_DIR:/data/rag/txt}
%prod.rag.location.csv=${RAG_CSV_DIR:/data/rag/csv}
%prod.rag.location.pdf=${RAG_PDF_DIR:/data/rag/pdf}

# Quarkus defaults to 10 M and the corpus manuals go over it. Verified: with
# this line a large PDF gets through /service/admin/upload; comment it out,
# restart, and the same file comes back with 413 Request Entity Too Large.
#
# Keep this in sync with the 413 message in index.html, which states the limit
# to the user in plain text.
#
# (quarkus.management.limits.max-body-size is the same limit for the management
#  interface, which this project does not enable: no need to touch it.)
quarkus.http.limits.max-body-size=15M

# =============================================================================
#  4 · Redis and the vector index
# =============================================================================
# The host is set explicitly and Dev Services are turned off so that all three
# environments — dev, test and the demo — always point at the SAME Redis. If the
# benchmark measured against an ephemeral container brought up on the fly, it
# would be measuring an empty index and every metric would come out at zero for
# a reason that has nothing to do with retrieval.
#
# Bring it up with RedisInsight included (http://localhost:8001):
#   docker run -d --name redis-tfg -p 6379:6379 -p 8001:8001 redis/redis-stack:latest
quarkus.redis.hosts=redis://localhost:6379
quarkus.devservices.enabled=false
# PROD: always explicit (Dev Services do not exist in prod).
%prod.quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}

# Vector index schema: bge-m3 produces 1024-dimension vectors.
quarkus.langchain4j.redis.dimension=1024

# The metadata Redis returns with every chunk on a search. Without declaring it,
# the metadata arrives EMPTY and the source cannot be shown (file/page = PDF,
# file_name = TXT, nombre/fila = CSV). Change this list and you change the index
# schema: FLUSHALL with the app stopped + start it + POST /service/admin/reset.
quarkus.langchain4j.redis.textual-metadata-fields=file,file_name,nombre
quarkus.langchain4j.redis.numeric-metadata-fields=fila,page

# The index name and the "embedding:" prefix are the extension's own defaults.
# The property below is NOT redundant: LexicalSearch reads it to run the
# FT.SEARCH of the lexical branch against that very index.
rag.redis.index=embedding-index

# =============================================================================
#  5 · The UNNAMED model: embeddings + injection detector + query rewriter
# =============================================================================
# This is Quarkus's "default model" and it is NOT the chat one: it is used by
# PromptInjectionDetectionService and QueryRewriteService, neither of which
# carries @ModelName. A classifier that returns a number has to be small, fast
# and deterministic: its own model, decoupled from the assistant, temperature 0.
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.embedding-model.provider=ollama
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.timeout=60s

quarkus.langchain4j.ollama.chat-model.model-id=${DETECTOR_MODEL:llama3.1:8b}
quarkus.langchain4j.ollama.chat-model.temperature=0.0

# Embeddings: bge-m3 (multilingual, 1024 dims). Do not change without reindexing.
quarkus.langchain4j.ollama.embedding-model.model-id=bge-m3

# -----------------------------------------------------------------------------
# Context length (num_ctx)
# -----------------------------------------------------------------------------
# quarkus-langchain4j 0.26.2 does NOT expose num-ctx as a property: its Ollama
# ChatModelConfig only covers temperature, num-predict, stop, top-p, top-k, seed,
# format and the two log-* flags. Any variant ("chat-model.num-ctx" or
# "chat-model.model-options.num-ctx") starts with a WARN about an unrecognised
# key and is ignored. The Ollama server defaults to 4096 tokens of context and it
# is raised on the SERVER, not in the application:
#
#     OLLAMA_CONTEXT_LENGTH=8192 ollama serve
#
# This matters: if the prompt goes over num_ctx, Ollama TRUNCATES from the front,
# silently. The RAG context travels in the system message, so that is exactly
# what would be lost — and it would look like a retrieval failure without being one.

# =============================================================================
#  6 · NAMED models (selectable per message from the UI)
# =============================================================================
# The living list is the es.upsa.ai.ModelSlot enum: if you add a slot here, add
# it there too (and only there: the UI and ChatService both read that enum).

# --- gpto: gpt-oss:20b. The demo model and the default slot -------------------
# A ~21B MoE with ~3.6B active: it answers like a small model and reasons like a
# large one, and it leaves room in memory for bge-m3 and the detector. That is
# exactly what qwen3.6:35b did not allow (see the memory-pressure table in the
# report).
quarkus.langchain4j.gpto.chat-model.provider=ollama
quarkus.langchain4j.ollama.gpto.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.gpto.chat-model.model-id=${GPTOSS_CHAT_MODEL:gpt-oss:20b}
quarkus.langchain4j.ollama.gpto.chat-model.temperature=0.2
quarkus.langchain4j.ollama.gpto.timeout=180s
# Writes the FULL request sent to the model into the log: the 9 system-prompt
# rules, the retrieved RAG context and the user's message, on every question.
# Priceless while debugging a prompt, a wall of text during a demo — and it is
# the same personal data the rest of the system is careful with. Set to false to
# turn it off; note it is only enabled on this slot, not on the other four.
quarkus.langchain4j.ollama.gpto.chat-model.log-requests=true

# --- llama: llama3.1:8b. Middle tier of the comparison -----------------------
quarkus.langchain4j.llama.chat-model.provider=ollama
quarkus.langchain4j.ollama.llama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.llama.chat-model.model-id=${OLLAMA_CHAT_MODEL:llama3.1:8b}
# Factual QA over a given context: low temperature (at 0.2, top-p/top-k add nothing).
quarkus.langchain4j.ollama.llama.chat-model.temperature=0.2
# Large models take a while to load the first time.
quarkus.langchain4j.ollama.llama.timeout=120s

# --- deepseek: the reasoner --------------------------------------------------
# Slower (hence the longer timeout) and less obedient with system prompts; useful
# as a contrast: it is the one that respects "answer only from the context" worst.
quarkus.langchain4j.deepseek.chat-model.provider=ollama
quarkus.langchain4j.ollama.deepseek.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.deepseek.chat-model.model-id=${DEEPSEEK_CHAT_MODEL:deepseek-r1:7b}
quarkus.langchain4j.ollama.deepseek.timeout=120s

# --- mistral -----------------------------------------------------------------
quarkus.langchain4j.mistral.chat-model.provider=ollama
quarkus.langchain4j.ollama.mistral.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.mistral.chat-model.model-id=${MISTRAL_CHAT_MODEL:mistral:instruct}
quarkus.langchain4j.ollama.mistral.timeout=60s

# --- gpt: the real OpenAI (needs OPENAI_API_KEY) -----------------------------
# With no key the value stays at "dummy" and ChatResource leaves the slot out of
# the dropdown, so the UI never offers a model that cannot answer.
quarkus.langchain4j.gpt.chat-model.provider=openai
quarkus.langchain4j.openai.gpt.api-key=${OPENAI_API_KEY:dummy}
quarkus.langchain4j.openai.gpt.chat-model.model-name=${OPENAI_CHAT_MODEL:gpt-4}

# --- qwen: WITHDRAWN ---------------------------------------------------------
# The qwen3.6:35b slot is withdrawn from the application: ~20 GB to download and,
# with it resident, the guardrail went from 0.3 s to 3.5 s and the search from
# 0.15 s to 1.1 s — components that do not even use it, degraded by memory
# pressure. The MEASUREMENT is not withdrawn: it is in the results chapter and it
# is one of the findings of this work. To reproduce it, declare the slot here
# again and add it back to ModelSlot.

# =============================================================================
#  7 · Conversation: memory and query rewriting
# =============================================================================
# Window in NUMBER OF MESSAGES (1 turn = question + answer = 2 messages).
# Now that memory holds CLEAN questions — the RAG context travels in the system
# message and is replaced every turn — the messages are small and we can afford
# more history than the 8 we used to keep: 12 = 6 turns.
quarkus.langchain4j.chat-memory.memory-window.max-messages=12

# With true, follow-up questions ("and how much is it?") are rewritten as
# self-contained queries using the history BEFORE searching Redis. It only
# affects the search: the chat model still receives the original question.
# Set it to false to measure the effect for the report (with/without comparison).
rag.query-rewrite.enabled=true

# =============================================================================
#  8 · Retrieval
# =============================================================================
# Candidates each search contributes to the fusion, and the final chunks that end
# up in the model's context. Externalised so values can be swept without
# recompiling — and the benchmark injects these very properties, not constants,
# so it always measures the running configuration.
rag.retriever.candidates=10
rag.retriever.max-results=3

# Calibrated on real logs (score = (1 + cosine) / 2 with bge-m3): the clearly
# relevant ones sit at 0.79-0.86 and the grey zone at 0.72-0.78. At 0.72 a
# greeting like "Hola" pulled in five chunks of noise while no real question lost
# anything, so it is fixed at 0.75.
rag.retriever.min-score=0.75

# =============================================================================
#  9 · Prompt injection guardrail
# =============================================================================
# The threshold above which a message is blocked. The detector returns a
# probability between 0.0 and 1.0. Calibrated with the examples in its own
# prompt: the clear attempts score 0.90-0.95, and "tell me everything you know
# about X" — legitimate curiosity, not an injection — scores 0.4. Cutting at 0.89
# lets that ambiguous case through and blocks the explicit ones. Raise it if the
# system feels too restrictive, lower it if something gets through.
guardrail.threshold=0.89

# =============================================================================
#  10 · Hybrid search and fusion
# =============================================================================
# With true, a BM25 search over the indexed text runs as well and both lists are
# merged with Reciprocal Rank Fusion. With false the system behaves exactly as it
# did before: this is the with/without switch of the comparison.
rag.hybrid.enabled=true

# Fusion parameters. k=60 is the conventional RRF value.
#
# Both weights are 1.0 (canonical RRF). A lower lexical weight (0.7) was tried,
# aimed at the accidental matches of conversational questions, and it wiped the
# lexical branch out completely: with k=60, 0.7/61 = 0.0115 is BELOW
# 1.0/70 = 0.0143, so the worst dense result beat the best lexical one and no
# lexical chunk ever reached the final three. The conversational noise was fixed
# where it belongs — in the query, with conjunctive semantics and a stop-word
# filter — and not by penalising a whole branch.
rag.fusion.k=60
rag.fusion.lexical-weight=1.0
rag.fusion.dense-weight=1.0