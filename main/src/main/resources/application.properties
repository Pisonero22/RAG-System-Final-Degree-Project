# --- Admin ---
admin.api-key=${ADMIN_API_KEY:cambia-esto-en-produccion}
# En prod SIN valor por defecto: si falta la variable, la app no arranca.
# Mejor un arranque fallido que un despliegue con la clave de ejemplo.
%prod.admin.api-key=${ADMIN_API_KEY}

# En desarrollo, usar la carpeta de recursos es cómodo (hot reload)
%dev.rag.location.txt=src/main/resources/rag/txt
%dev.rag.location.csv=src/main/resources/rag/csv
%dev.rag.location.pdf=src/main/resources/rag/pdf

# En producción, apuntar a un volumen persistente fuera del artefacto
%prod.rag.location.txt=${RAG_TXT_DIR:/data/rag/txt}
%prod.rag.location.csv=${RAG_CSV_DIR:/data/rag/csv}
%prod.rag.location.pdf=${RAG_PDF_DIR:/data/rag/pdf}

###REDIS###
redis.hosts=${REDIS_HOSTS:redis://localhost:6379}
rag.redis.index=${RAG_REDIS_INDEX:embedding-index}


####OLLAMA####
# --- Ollama (extensión Quarkus: embeddings + detector de inyección) ---
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.chat-model-id=${OLLAMA_CHAT_MODEL:llama3.2}

quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.embedding-model.provider=ollama
quarkus.langchain4j.ollama.embedding-model.model-id=mxbai-embed-large
quarkus.langchain4j.redis.dimension=1024
quarkus.langchain4j.ollama.timeout=60


####OPENAI####
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:dummy}
openai.chat-model-id=${OPENAI_CHAT_MODEL:gpt-4}

