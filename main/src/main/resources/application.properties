# =============================================================================
#  Seguridad de los endpoints de administración
# =============================================================================
# La usa AdminApiKeyFilter: los endpoints anotados con @AdminEndpoint
# (/service/admin/reset, /service/admin/upload) exigen la cabecera
# X-API-KEY con este valor.
admin.api-key=${ADMIN_API_KEY:API}
# En prod SIN valor por defecto: si falta la variable, la app no arranca.
# Mejor un arranque fallido que un despliegue con la clave de ejemplo.
%prod.admin.api-key=${ADMIN_API_KEY}

# =============================================================================
#  Logging
# =============================================================================
# DEBUG para ver las líneas del RAG (chunks + scores) y del guardrail.
# Para la demo final puedes subirlo a INFO (quedan modelo y tiempos).
quarkus.log.category."es.upsa".level=DEBUG
# En los tests no interesa el detalle: solo el informe del benchmark.
%test.quarkus.log.category."es.upsa".level=WARN

# =============================================================================
#  Ubicación de los documentos RAG
# =============================================================================
rag.location.txt=data/rag/txt
rag.location.csv=data/rag/csv
rag.location.pdf=data/rag/pdf

%prod.rag.location.txt=${RAG_TXT_DIR:/data/rag/txt}
%prod.rag.location.csv=${RAG_CSV_DIR:/data/rag/csv}
%prod.rag.location.pdf=${RAG_PDF_DIR:/data/rag/pdf}

# =============================================================================
#  Límite de subida
# =============================================================================
# El valor por defecto de Quarkus son 10 M y los manuales del corpus los pasan.
# Verificado: con esta línea, un PDF de 18 MB entra por /service/admin/upload;
# coméntala, reinicia y el mismo fichero devuelve 413 Request Entity Too Large.
# (quarkus.management.limits.max-body-size es el mismo límite para el interfaz
#  de management, que este proyecto no activa: no hace falta tocarla.)
quarkus.http.limits.max-body-size=15M

# =============================================================================
#  Redis
# =============================================================================
# Se fija el host de forma explícita y se apagan los Dev Services para que los
# tres entornos —dev, test y la demo— apunten SIEMPRE al mismo Redis: si el
# benchmark midiera contra un contenedor efímero levantado al vuelo, mediría un
# índice vacío y todas las métricas saldrían a cero por una razón que no tiene
# nada que ver con la recuperación.
#
# Levántalo con RedisInsight incluido (http://localhost:8001):
#   docker run -d --name redis-tfg -p 6379:6379 -p 8001:8001 redis/redis-stack:latest
quarkus.redis.hosts=redis://localhost:6379
quarkus.devservices.enabled=false
# PROD: siempre explícito (en prod no existen los Dev Services).
%prod.quarkus.redis.hosts=${REDIS_HOSTS:redis://localhost:6379}

# Esquema del índice vectorial: bge-m3 produce vectores de 1024 dimensiones.
quarkus.langchain4j.redis.dimension=1024

# Metadatos que Redis devuelve con cada chunk al buscar. Sin declararlos,
# la metadata llega VACÍA y no se puede mostrar la fuente (file/page = PDF,
# file_name = TXT, nombre/fila = CSV). Si cambias esta lista, cambia el
# esquema del índice: FLUSHALL con la app parada + arrancar + POST /service/admin/reset.
quarkus.langchain4j.redis.textual-metadata-fields=file,file_name,nombre
quarkus.langchain4j.redis.numeric-metadata-fields=fila,page

# El nombre del índice y el prefijo "embedding:" son los valores por defecto de
# la extensión. La propiedad de abajo NO es redundante: LexicalSearch la lee
# para lanzar el FT.SEARCH de la rama léxica sobre ese mismo índice.
rag.redis.index=embedding-index

# =============================================================================
#  Modelo SIN NOMBRE: embeddings + detector de inyección + reescritor de consultas
# =============================================================================
# Este es el "modelo por defecto" de Quarkus y NO es el del chat: lo usan
# PromptInjectionDetectionService y QueryRewriteService, que no llevan @ModelName.
# Un clasificador que devuelve un número debe ser pequeño, rápido y determinista:
# modelo propio (desacoplado del asistente) y temperatura 0.
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.embedding-model.provider=ollama
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.timeout=60s

quarkus.langchain4j.ollama.chat-model.model-id=${DETECTOR_MODEL:llama3.1:8b}
quarkus.langchain4j.ollama.chat-model.temperature=0.0

# Embeddings: bge-m3 (multilingüe, 1024 dims). No cambiar sin reindexar.
quarkus.langchain4j.ollama.embedding-model.model-id=bge-m3

# -----------------------------------------------------------------------------
# Longitud de contexto (num_ctx)
# -----------------------------------------------------------------------------
# quarkus-langchain4j 0.26.2 NO expone num-ctx como propiedad: su ChatModelConfig
# de Ollama solo cubre temperature, num-predict, stop, top-p, top-k, seed, format
# y los dos log-*. Cualquier variante ("chat-model.num-ctx" o
# "chat-model.model-options.num-ctx") arranca con un WARN de clave no reconocida
# y se ignora. El contexto por defecto del servidor de Ollama son 4096 tokens y
# se sube en el SERVIDOR, no en la aplicación:
#
#     OLLAMA_CONTEXT_LENGTH=8192 ollama serve
#
# Importante: si el prompt supera num_ctx, Ollama TRUNCA por el principio en
# silencio; como el contexto RAG viaja en el system message, se perdería justo
# eso y parecería un fallo de recuperación sin serlo.

# =============================================================================
#  Modelos NOMBRADOS (seleccionables por mensaje desde la UI)
# =============================================================================
# La lista viva está en el enum es.upsa.ai.ModelSlot: si añades un slot aquí,
# añádelo también allí (y solo allí: la UI y ChatService salen de ese enum).

# --- gpto: gpt-oss:20b. El de la demo y el slot por defecto -------------------
# MoE de ~21B con ~3,6B activos: responde como un modelo pequeño y contesta como
# uno grande, y deja sitio en memoria a bge-m3 y al detector. Es exactamente lo
# que qwen3.6:35b no permitía (ver la tabla de presión de memoria de la memoria).
quarkus.langchain4j.gpto.chat-model.provider=ollama
quarkus.langchain4j.ollama.gpto.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.gpto.chat-model.model-id=${GPTOSS_CHAT_MODEL:gpt-oss:20b}
quarkus.langchain4j.ollama.gpto.chat-model.temperature=0.2
quarkus.langchain4j.ollama.gpto.timeout=180s
quarkus.langchain4j.ollama.gpto.chat-model.log-requests=true

# --- llama: llama3.1:8b. Tier medio de la comparativa ------------------------
quarkus.langchain4j.llama.chat-model.provider=ollama
quarkus.langchain4j.ollama.llama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.llama.chat-model.model-id=${OLLAMA_CHAT_MODEL:llama3.1:8b}
# QA factual sobre contexto: temperatura baja (con 0.2, top-p/top-k sobran).
quarkus.langchain4j.ollama.llama.chat-model.temperature=0.2
# Los modelos grandes tardan en cargar la primera vez.
quarkus.langchain4j.ollama.llama.timeout=120s

# --- deepseek: razonador -----------------------------------------------------
# Más lento (timeout mayor) y menos obediente con los system prompts; útil como
# comparativa: es el que peor respeta la regla de "responde solo con el contexto".
quarkus.langchain4j.deepseek.chat-model.provider=ollama
quarkus.langchain4j.ollama.deepseek.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.deepseek.chat-model.model-id=${DEEPSEEK_CHAT_MODEL:deepseek-r1:7b}
quarkus.langchain4j.ollama.deepseek.timeout=120s

# --- mistral -----------------------------------------------------------------
quarkus.langchain4j.mistral.chat-model.provider=ollama
quarkus.langchain4j.ollama.mistral.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.mistral.chat-model.model-id=${MISTRAL_CHAT_MODEL:mistral:instruct}
quarkus.langchain4j.ollama.mistral.timeout=60s

# --- gpt: OpenAI real (requiere OPENAI_API_KEY) ------------------------------
quarkus.langchain4j.gpt.chat-model.provider=openai
quarkus.langchain4j.openai.gpt.api-key=${OPENAI_API_KEY:dummy}
quarkus.langchain4j.openai.gpt.chat-model.model-name=${OPENAI_CHAT_MODEL:gpt-4}

# --- qwen: RETIRADO ----------------------------------------------------------
# El slot qwen3.6:35b se retira de la aplicación: son ~20 GB de descarga y, con
# él residente, el guardrail pasaba de 0,3 s a 3,5 s y la búsqueda de 0,15 s a
# 1,1 s — componentes que no lo usan, degradados por la presión de memoria.
# La medición NO se retira: está en el capítulo de resultados, y es uno de los
# hallazgos del trabajo. Para reproducirla basta con volver a declarar el slot
# aquí y añadirlo a ModelSlot.

# =============================================================================
#  Memoria conversacional
# =============================================================================
# Ventana en Nº de MENSAJES (1 turno = pregunta + respuesta = 2 mensajes).
# Ahora que la memoria guarda preguntas LIMPIAS (el contexto RAG viaja en el
# system message y se reemplaza cada turno), los mensajes son pequeños y
# podemos permitirnos más historial que los 8 de antes: 12 = 6 turnos.
quarkus.langchain4j.chat-memory.memory-window.max-messages=12

# =============================================================================
#  Reescritura de consulta con historial (RAG conversacional)
# =============================================================================
# Con true, las preguntas de seguimiento ("¿y cuánto cuesta?") se reescriben
# como consultas autocontenidas usando el historial ANTES de buscar en Redis.
# Solo afecta a la búsqueda: el modelo del chat recibe la pregunta original.
# Ponla a false para medir el efecto en la memoria del TFG (comparativa con/sin).
rag.query-rewrite.enabled=true

# =============================================================================
#  Recuperación
# =============================================================================
# Candidatos que aporta CADA búsqueda a la fusión, y chunks finales que
# acaban en el contexto del modelo. Externalizados para poder barrer valores
# sin recompilar (y el benchmark inyecta estos mismos valores, no constantes).
rag.retriever.candidates=10
rag.retriever.max-results=3
rag.retriever.min-score=0.75

# =============================================================================
#  Guardrail de prompt injection
# =============================================================================
# Umbral por encima del cual el mensaje se bloquea. El detector devuelve una
# probabilidad entre 0,0 y 1,0. Calibrado con los ejemplos del propio prompt:
# los intentos claros puntúan 0,90-0,95 y "dime todo lo que sepas de X" —que es
# curiosidad legítima, no inyección— puntúa 0,4. El corte en 0,89 deja pasar ese
# caso ambiguo y bloquea los explícitos. Súbelo si el sistema es demasiado
# restrictivo, bájalo si se cuela algún intento.
guardrail.threshold=0.89

# =============================================================================
#  Búsqueda híbrida
# =============================================================================
# Con true se lanza también una búsqueda BM25 sobre el texto indexado y ambas
# listas se fusionan con Reciprocal Rank Fusion. A false, el sistema se comporta
# exactamente como antes: es el interruptor de la comparativa con/sin.
rag.hybrid.enabled=true

# Parámetros de la fusión. k=60 es el valor convencional de RRF.
# Los dos pesos van a 1.0 (RRF canónico). Se probó un peso léxico menor (0,7)
# pensando en las coincidencias casuales de las preguntas conversacionales, y
# anulaba la rama léxica por completo: con k=60, 0,7/61 = 0,0115 es MENOR que
# 1,0/70 = 0,0143, o sea que el peor resultado denso superaba al mejor resultado
# léxico y ningún chunk léxico llegaba nunca a los tres finales. El ruido
# conversacional se resolvió donde corresponde —en la consulta, con semántica
# conjuntiva y palabras vacías— y no penalizando la rama.
rag.fusion.k=60
rag.fusion.lexical-weight=1.0
rag.fusion.dense-weight=1.0