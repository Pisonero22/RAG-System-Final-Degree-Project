services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379" # Redis / RediSearch
      - "8001:8001" # RedisInsight (GUI): http://localhost:8001
    restart: always
    volumes:
      # Persistence: the embeddings survive stops and restarts.
      # If you change the embedding model or the dimension, delete this volume.
      - ./redis-data:/data

