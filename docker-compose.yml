services:
  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "6379:6379" # Redis / RediSearch
      - "8001:8001" # RedisInsight (GUI): http://localhost:8001
    restart: always
    volumes:
      # Persistencia: los embeddings sobreviven a paradas y reinicios.
      # Si cambias de modelo de embeddings o de dimensión: borra el volumen
      # (docker volume ls / docker volume rm ...) o FLUSHALL, y reingesta.
      - ./redis-data:/data
volumes:
  redis-data:

